<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>un orario scolastico</title><style>
:root{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;color:#243449;background:#f5f7fb}*{box-sizing:border-box}body{margin:0}.wrap{max-width:950px;margin:auto;padding:18px}header{background:#273d57;color:white;padding:24px;border-radius:18px;margin-bottom:16px}h1{font-size:clamp(25px,5vw,38px);margin:0;font-weight:650}header p{margin:5px 0 0;color:#dce6f1}.tabs,.days,.controls{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}button{font:inherit;cursor:pointer;border:1px solid #cbd4e0;border-radius:10px;padding:10px 14px;background:white;color:#243449}button.active{background:#273d57;color:white;border-color:#273d57}button:disabled{opacity:.4;cursor:default}.panel{background:white;border:1px solid #e0e5ed;border-radius:16px;padding:17px;margin:12px 0}.hidden{display:none}.lesson{display:flex;align-items:center;gap:12px;padding:10px;border-radius:11px;margin:6px 0;background:#f6f8fb}.lesson.current{outline:2px solid #536e93}.num{width:34px;flex-shrink:0;color:#526174}.symbol{width:39px;height:39px;display:grid;place-items:center;border-radius:10px;font-size:21px;flex-shrink:0}.subject{font-weight:650}.room{font-size:13px;color:#5c6777}.tag{margin-left:auto;font-size:12px;color:#355d4a;background:#e8f3eb;padding:5px 7px;border-radius:7px;white-space:nowrap}.main-card{padding:22px;border-radius:15px;background:#eef2f8}.main-card h2{margin:8px 0;font-size:28px}.small{font-size:13px;color:#617083}.gridwrap{overflow:auto}.week{border-collapse:separate;border-spacing:5px;width:100%;min-width:650px}.week th{font-size:13px}.week td{vertical-align:top;width:19%;padding:9px;border-radius:9px;font-size:13px}.week td.empty{background:#f6f7f9}.week td strong{display:block}.week td span{font-size:11px}.materials label{display:flex;gap:10px;align-items:center;border-bottom:1px solid #edf0f5;padding:11px 0}.materials input{width:19px;height:19px;accent-color:#426d95}footer{font-size:12px;color:#677485;margin:24px 0} @media(max-width:600px){.wrap{padding:10px}.panel{padding:12px}.tag{font-size:11px}.lesson{gap:8px}.room{font-size:12px}}
</style></head><body><div class="wrap"><header><h1>un orario scolastico</h1><p>Il mio orario, le mie aule, il mio materiale</p></header><nav class="tabs" aria-label="Sezioni"><button data-tab="oggi" class="active">Lezioni del giorno</button><button data-tab="settimana">Settimana</button><button data-tab="materiale">Materiale</button></nav><section class="panel"><div class="days" id="days"></div><div id="oggi"></div><div id="settimana" class="hidden"></div><div id="materiale" class="hidden"></div></section><footer>Il planner è personale: le spunte sono facoltative e rimangono salvate su questo dispositivo. Non vengono inviate a nessuno.</footer></div><script>
const rooms={ita:{name:'Italiano, Storia e Geografia',color:'#f0cbbf',icon:'📖'},mat:{name:'Matematica e Scienze',color:'#bfdcf5',icon:'🔢'},pal:{name:'Palestra',color:'#b9dfd0',icon:'👟'},art:{name:'Arte',color:'#cde7c0',icon:'🎨'},orc:{name:'Orchestra',color:'#f1d3a6',icon:'🎸'},eng:{name:'Inglese',color:'#f7e2a6',icon:'🌍'},tec:{name:'Tecnologia',color:'#dcd1e7',icon:'📐'},mus:{name:'Musica',color:'#efc9e5',icon:'🎵'},deu:{name:'Tedesco',color:'#cfc5ee',icon:'💬'},chi:{name:'Chitarra',color:'#f3c9b3',icon:'🎸'}};
const schedule=[{day:'Lunedì',lessons:[['Antologia','ita'],['Storia','ita'],['Palestra','pal'],['Arte','art'],['Orchestra','orc'],['Orchestra','orc'],['Scienze','mat'],['Inglese','eng']]},{day:'Martedì',lessons:[['Tecnologia','tec'],['Musica','mus'],['Aritmetica','mat'],['Tedesco','deu'],['Palestra','pal']]},{day:'Mercoledì',lessons:[['Tedesco','deu'],['Arte','art'],['Grammatica','ita'],['Inglese','eng'],['Antologia + Geografia','ita'],['Chitarra','chi']]},{day:'Giovedì',lessons:[['Antologia','ita'],['Epica','ita'],['Storia','ita'],['Tecnologia (disegno)','tec'],['Geometria','mat'],['Scienze','mat']]},{day:'Venerdì',lessons:[['Inglese','eng'],['Musica','mus'],['Aritmetica','mat'],['Geometria','mat'],['Grammatica','ita'],['Geografia','ita']]}];
let day=Math.min(new Date().getDay()-1,4);if(day<0)day=0;let period=0,tab='oggi';const $=id=>document.getElementById(id);const escapeHtml=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function materialList(lessons){let names=[];for(const [s] of lessons){if(s==='Antologia + Geografia'){names.push('Antologia','Geografia')}else names.push(s)}return [...new Set(names)]}
function render(){document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));['oggi','settimana','materiale'].forEach(id=>$(id).classList.toggle('hidden',id!==tab));$('days').innerHTML=schedule.map((d,i)=>`<button class="${day===i?'active':''}" data-day="${i}">${d.day}</button>`).join('');document.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>{day=Number(b.dataset.day);period=0;render()});const d=schedule[day],cur=d.lessons[period],r=rooms[cur[1]],next=d.lessons[period+1];$('oggi').innerHTML=`<div class="main-card"><div class="small">${d.day.toUpperCase()} · ${period+1}ª ORA DI ${d.lessons.length}</div><h2>${escapeHtml(cur[0])}</h2><div>${r.icon} ${escapeHtml(r.name)}</div><p class="small">${next?(next[1]===cur[1]?'La prossima lezione è nella stessa aula.':'La prossima lezione è in un’altra aula.'):'Ultima lezione della giornata.'}</p><div class="controls"><button id="prev" ${period===0?'disabled':''}>← Precedente</button><button id="next" ${!next?'disabled':''}>Successiva →</button></div></div><h3>Tutte le lezioni</h3>`+d.lessons.map(([s,key],i)=>`<div class="lesson ${i===period?'current':''}" data-period="${i}"><span class="num">${i+1}ª</span><span class="symbol" style="background:${rooms[key].color}">${rooms[key].icon}</span><div><div class="subject">${escapeHtml(s)}</div><div class="room">${escapeHtml(rooms[key].name)}</div></div>${i>0&&d.lessons[i-1][1]===key?'<span class="tag">Stessa aula</span>':''}</div>`).join('');$('prev').onclick=()=>{period--;render()};$('next').onclick=()=>{period++;render()};document.querySelectorAll('[data-period]').forEach(e=>e.onclick=()=>{period=Number(e.dataset.period);render()});$('settimana').innerHTML='<div class="gridwrap"><table class="week"><thead><tr><th>Ora</th>'+schedule.map(d=>`<th>${d.day}</th>`).join('')+'</tr></thead><tbody>'+Array.from({length:8},(_,i)=>'<tr><th>'+(i+1)+'ª</th>'+schedule.map(d=>{const l=d.lessons[i];return l?`<td style="background:${rooms[l[1]].color}"><strong>${escapeHtml(l[0])}</strong><span>${escapeHtml(rooms[l[1]].name)}</span></td>`:'<td class="empty"></td>'}).join('')+'</tr>').join('')+'</tbody></table></div>';
const mats=materialList(d.lessons);$('materiale').innerHTML='<h2>Materiale per '+d.day.toLowerCase()+'</h2><p class="small">Spunte facoltative: puoi usarle per preparare libri e quaderni. Per mercoledì, Antologia e Geografia sono entrambe previste nella quinta ora.</p><div class="materials">'+mats.map(s=>{const key='orario-v1-'+d.day+'-'+s;let checked=false;try{checked=localStorage.getItem(key)==='1'}catch(e){}return `<label><input type="checkbox" data-store="${escapeHtml(key)}" ${checked?'checked':''}><span>${escapeHtml(s)}</span></label>`}).join('')+'</div><button id="clear">Azzera le spunte di questo giorno</button>';document.querySelectorAll('[data-store]').forEach(el=>el.onchange=()=>{try{localStorage.setItem(el.dataset.store,el.checked?'1':'0')}catch(e){}});$('clear').onclick=()=>{mats.forEach(s=>{try{localStorage.removeItem('orario-v1-'+d.day+'-'+s)}catch(e){}});render()}}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});render();
</script></body></html>
